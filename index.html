function createUnsplashProductMaterial(name, price, imgUrl, accentColor){
  const c=document.createElement('canvas');c.width=256;c.height=300;const x=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c);

  function draw(img=null){
    x.fillStyle='#ffffff';x.fillRect(0,0,256,300);
    x.fillStyle=accentColor||'#ea580c';x.fillRect(0,0,256,12);
    if(img && img.complete && img.naturalWidth > 0){
      x.drawImage(img,14,18,228,180);
    } else {
      x.fillStyle='#f1f5f9';x.fillRect(14,18,228,180);
      x.fillStyle='#64748b';x.font='bold 22px system-ui,sans-serif';x.textAlign='center';
      x.fillText('OrangeMart',128,110);
    }
    x.strokeStyle='#e2e8f0';x.lineWidth=2;x.strokeRect(14,18,228,180);
    x.fillStyle='#0f172a';x.textAlign='center';x.textBaseline='middle';
    if(name.length > 22){
      x.font='bold 14px system-ui,sans-serif';
      x.fillText(name.slice(0,24),128,224);
      x.fillText(name.slice(24,46),128,244);
    } else {
      x.font='bold 17px system-ui,sans-serif';
      x.fillText(name,128,232);
    }
    x.fillStyle='#ea580c';x.font='900 20px system-ui,sans-serif';
    x.fillText('PKR '+price,128,276);
    tex.needsUpdate=true;
  }
  draw(null);
  if(imgUrl){
    const img=new Image();img.crossOrigin="anonymous";
    img.onload=()=>draw(img);img.onerror=()=>draw(null);
    img.src=imgUrl;
  }
  return L({map:tex});
}

  const waist=new THREE.Mesh(new THREE.BoxGeometry(.4,.18,.26),pantsMat);waist.position.set(0,.83,0);g.add(waist);

  g.arms=[-1,1].map(side=>{
    const shoulder=new THREE.Group();shoulder.position.set(side*.26,1.26,0);
    const armMesh=new THREE.Mesh(new THREE.CylinderGeometry(.065,.055,.44,10),shirtMat);armMesh.position.set(0,-.2,0);shoulder.add(armMesh);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),skinMat);hand.position.set(0,-.44,0);shoulder.add(hand);

    g.arms[0].rotation.set(-.58,.15,0);

  g.legs=[-1,1].map(side=>{
    const hip=new THREE.Group();hip.position.set(side*.125,.74,0);
    const legMesh=new THREE.Mesh(new THREE.CylinderGeometry(.08,.07,.62,10),pantsMat);legMesh.position.set(0,-.31,0);hip.add(legMesh);

  if(hasTrolley){

      if(trolley.itemsCount>=18)return;

      im.position.set(-.14+(n%3)*.14, .06+Math.floor(n/6)*.12, -.18+(Math.floor((n%6)/3))*.2);
      im.rotation.set(Math.random()*.2,n*.5,0);
      trolley.itemsGroup.add(im);
      trolley.itemsCount++;
    };
    g.clearTrolley=function(){
      while(trolley.itemsGroup.children.length>0) trolley.itemsGroup.remove(trolley.itemsGroup.children[0]);

  const tc=document.createElement('canvas');tc.width=256;tc.height=68;const tx=tc.getContext('2d');

  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(tc),transparent:true}));
  sp.scale.set(1.4,.38,1);sp.position.y=2.15;g.add(sp);g.tag=sp;

  return g;
}

function animateTrolleyPush(g,T,isMoving){
  if(isMoving){
    const s=Math.sin(T*8.5)*.62;
    g.legs[0].rotation.x=s;g.legs[1].rotation.x=-s;
    g.arms[0].rotation.x=-.58+Math.sin(T*8.5)*.04;
    g.arms[1].rotation.x=-.58-Math.sin(T*8.5)*.04;
    g.position.y=Math.abs(Math.sin(T*8.5))*.03;
  } else {
    g.legs[0].rotation.x=0;g.legs[1].rotation.x=0;
    g.arms[0].rotation.x=-.58;g.arms[1].rotation.x=-.58;
    g.chestRef.scale.y=1+Math.sin(T*2.5)*.02;
    g.position.y=0;
  }
}

// Safe Navigation System
const AISLE_X = [-14.5, -8.0, -2.0, 4.0, 10.0, 14.5];
const CROSS_Z = [8.5, 0.0, -8.5, -16.5];
function getClosest(val, arr){return arr.reduce((p,c)=>Math.abs(c-val)<Math.abs(p-val)?c:p)}

function planSafeAislePath(n, targetX, targetZ){
  const startAisleX = getClosest(n.x, AISLE_X);
  const targetAisleX = getClosest(targetX, AISLE_X);
  const crossZ = getClosest(n.z, CROSS_Z);
  const w = [];
  if(Math.abs(n.z - crossZ) > 0.25) w.push([startAisleX, crossZ]);
  if(Math.abs(startAisleX - targetAisleX) > 0.25) w.push([targetAisleX, crossZ]);
  w.push([targetAisleX, targetZ]);
  n.wp = w;
}

function nextShelf(n){
  if(!gond.length) return;
  const k=Math.floor(Math.random()*gond.length);
  const targetGondola = gond[k];
  const sideOffset = (targetGondola.x >= 4) ? -1.6 : 1.6;
  const safeWalkX = targetGondola.x + sideOffset;
  planSafeAislePath(n, safeWalkX, targetGondola.z);
}

function npcTick(n,dt,T){
  const g=n.g;
  if(n.st==='wait'){
    n.t-=dt;
    if(n.t<=0){
      n.st='shop';n.n=2+Math.floor(Math.random()*3);n.k=0;n.sum=0;
      g.visible=true;g.clearTrolley();n.x=10;n.z=16;g.position.set(n.x,0,n.z);
      nextShelf(n);
    }
    return;
  }

  // Aisle Traffic & Rasta Dena
  let steerX = 0, steerZ = 0, speedMultiplier = 1.0;
  for(const other of NP){
    if(other === n || !other.g.visible) continue;
    const dist = Math.hypot(n.x - other.x, n.z - other.z);
    if(dist < 1.5 && dist > 0.05){
      const pushStrength = (1.5 - dist) * 1.8;
      steerX += ((n.x - other.x) / dist) * pushStrength;
      steerZ += ((n.z - other.z) / dist) * pushStrength;
      if(n.wp.length > 0){
        const [tx, tz] = n.wp[0];
        const dot = (tx - n.x)*(other.x - n.x) + (tz - n.z)*(other.z - n.z);
        if(dot > 0){ steerX += 0.45; speedMultiplier = 0.65; }
      }
    }
  }

  const movedDist = Math.hypot(n.x - n.lastX, n.z - n.lastZ);
  if(movedDist < 0.05 * dt){
    n.stuckTimer += dt;
    if(n.stuckTimer > 1.8){
      n.stuckTimer = 0;
      if(n.st === 'shop' || n.st === 'queue') nextShelf(n);
    }
  } else { n.stuckTimer = 0; }
  n.lastX = n.x; n.lastZ = n.z;

  let mv = 0;
  if(n.wp.length){
    const [tx,tz]=n.wp[0];
    let dx = (tx - n.x) + steerX * 0.4;
    let dz = (tz - n.z) + steerZ * 0.4;
    const d = Math.hypot(dx,dz);

    if(d < 0.12){
      n.x = tx; n.z = tz; n.wp.shift();
    } else {
      const step = Math.min(d, 1.85 * dt * speedMultiplier);
      n.x += (dx / d) * step;
      n.z += (dz / d) * step;
      g.rotation.y = Math.atan2(dx, dz);
      mv = 1;
    }
  }

  g.position.x = n.x;
  g.position.z = n.z;
  animateTrolleyPush(g,T,mv);
  if(n.wp.length) return;

  if(n.st==='shop'){
    n.st='pick';n.t=1.4;g.rotation.y=-Math.PI/2;
    g.arms[1].rotation.set(-1.1,.6,0);
  }
  else if(n.st==='pick'){
    n.t-=dt;
    if(n.t<=0 && PR.length){
      n.k++;
      const randomProd=PR[Math.floor(Math.random()*PR.length)];
      n.sum+=randomProd.p;
      g.addTrolleyItem(randomProd.c);
      g.arms[1].rotation.set(-.58,-.15,0);
      if(n.k<n.n){n.st='shop';nextShelf(n)}else n.st='toCounter';
    }
  }
  else if(n.st==='toCounter'){
    const c=CT.filter(c=>!c.real&&c.q.length<3).sort((a,b)=>a.q.length-b.q.length)[0];
    if(c){
      n.ct=c;c.q.push(n);n.st='queue';
      planSafeAislePath(n, c.x, qz(c.q.length-1));
    }
  }
  else if(n.st==='queue'){
    const c=n.ct;g.rotation.y=0;
    if(c.q[0]===n&&!c.busy){c.busy=1;c.t=0;n.st='bill';disp(c,'SCANNING ITEMS…','#f59f00')}
  }
  else if(n.st==='bill'){
    const c=n.ct;c.t+=dt;
    if(c.t>2.8){
      disp(c,'COD: PKR '+n.sum,'#16a34a');c.busy=0;c.reset=2.5;c.q.shift();
      c.q.forEach((m,i)=>planSafeAislePath(m,c.x,qz(i)));
      n.st='exit';
      planSafeAislePath(n, 2, 16.5);
    }
  }
  else if(n.st==='exit'){g.visible=false;n.st='wait';n.t=2+Math.random()*4}
}

let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  yaw-=(e.clientX-drag.x)*.005;pitch-=(e.clientY-drag.y)*.005;
  pitch=Math.max(-1.1,Math.min(1.1,pitch));drag.x=e.clientX;drag.y=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const mv=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy),dt=performance.now()-drag.t;
  if(mv<8&&dt<350)tap(e.clientX,e.clientY);
  drag=null;
});

const ray=new THREE.Raycaster();
function tap(px,py){
  closeP();
  ray.setFromCamera({x:px/innerWidth*2-1,y:-(py/innerHeight)*2+1},cam);
  const h=ray.intersectObjects(hits)[0];
  if(h&&h.distance<9)add(h.object.userData.id);
}

  for(const i in cart){n+=cart[i];t+=cart[i]*PR[i].p;h+=`<div class="row"><span>${PR[i].e} ${PR[i].n} × ${cart[i]}</span><b>PKR ${cart[i]*PR[i].p}</b></div>`}
  btn.textContent=`🛒 ${n} · PKR ${t}`;
  panel.innerHTML=(h||'<div class="row">Cart is empty</div>')+(n?`<div class="row"><b>Total Amount</b><b>PKR ${t}</b></div><button id="clr">Empty Cart</button>`:'');
  const c=document.getElementById('clr');if(c)c.onclick=()=>{for(const k in cart)delete cart[k];render();trolleyClear()};
}
function closeP(){panel.style.display='none';aisles.style.display='none'}
btn.onclick=()=>{const o=panel.style.display==='block';closeP();if(!o)panel.style.display='block'};
document.getElementById('aBtn').onclick=()=>{const o=aisles.style.display==='grid';closeP();if(!o)aisles.style.display='grid'};

// Billing, Cash on Delivery & Google Sheet
const bill=document.getElementById('bill'),bc=document.getElementById('bc'),billBtn=document.getElementById('billBtn');
let billTok=0,billNo=94210;
function closeBill(){billTok++;bill.style.display='none';const r=CT[3];if(r.busy){r.busy=0;disp(r,'CHECKOUT 04 · OPEN','#16a34a')}}

function generatePdfInvoice(purchasedItems, sub, gst, total, invoiceNumber, dateString, custName, custPhone, custAddress){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFillColor(15, 23, 42);
  doc.rect(0, 0, 210, 36, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(22);
  doc.setFont('helvetica', 'bold');
  doc.text('ORANGE MART MEGA', 14, 18);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text('Smart Retail Superstore · Official Tax Invoice', 14, 26);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(249, 115, 22);
  doc.text('PAYMENT: CASH ON DELIVERY', 140, 26);

  doc.setTextColor(30, 41, 59);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text(`Invoice No: INV-${invoiceNumber}`, 14, 44);
  doc.text(`Date & Time: ${dateString}`, 14, 50);
  doc.text(`Customer Name: ${custName}`, 14, 56);
  doc.text(`Phone / WhatsApp: ${custPhone}`, 14, 62);
  doc.text(`Delivery Address: ${custAddress}`, 14, 68);

  doc.setFillColor(241, 245, 249);
  doc.rect(14, 74, 182, 8, 'F');
  doc.setFont('helvetica', 'bold');
  doc.text('Item Description', 18, 79);
  doc.text('Qty', 110, 79);
  doc.text('Price (PKR)', 135, 79);
  doc.text('Total (PKR)', 165, 79);

  doc.setFont('helvetica', 'normal');
  let y = 88;
  purchasedItems.forEach(it => {
    doc.text(it.n.slice(0,30), 18, y);
    doc.text(String(it.q), 112, y);
    doc.text(`${it.p}`, 138, y);
    doc.text(`${it.q * it.p}`, 168, y);
    y += 7;
  });

  y += 4;
  doc.setDrawColor(203, 213, 225);
  doc.line(14, y, 196, y);
  y += 8;
  doc.text('Subtotal:', 125, y);
  doc.text(`PKR ${sub}`, 165, y);
  y += 6;
  doc.text('Sales Tax (5%):', 125, y);
  doc.text(`PKR ${gst}`, 165, y);
  y += 8;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.text('Net Total (COD):', 115, y);
  doc.text(`PKR ${total}`, 165, y);

  doc.setFontSize(9);
  doc.setFont('helvetica', 'italic');
  doc.setTextColor(100, 116, 139);
  doc.text('Payment terms: Cash on Delivery. Rider will collect exact cash upon open parcel delivery. Shukriya!', 14, y + 20);

  doc.save(`OrangeMart_Invoice_INV-${invoiceNumber}.pdf`);
}

function sendOrderToGoogleSheet(orderPayload){
  if(GOOGLE_SHEET_WEBAPP_URL && GOOGLE_SHEET_WEBAPP_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"){
    fetch(GOOGLE_SHEET_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderPayload)
    }).catch(e => console.log('Sheet Sync error:', e));
  } else {
    console.log("Mock Google Sheet Sync Payload:", orderPayload);
  }
}

function pay(sub,tok,ft,purchasedItems){
  const gst=Math.round(sub*.05),tot=sub+gst;
  ft.innerHTML=`
    <div class='r'><span>Subtotal</span><b>PKR ${sub}</b></div>
    <div class='r'><span>Sales Tax (5%)</span><b>PKR ${gst}</b></div>
    <div class='r' style='font-size:16px;border-top:2px solid #0f172a;padding-top:6px'><b>Net Total Amount</b><b>PKR ${tot}</b></div>
    
    <div style='margin-top:12px;font-weight:700;color:#0f172a'>Enter Customer Delivery Details:</div>
    <input type='text' id='cName' class='custInput' placeholder='Aapka Mukammal Naam (Required)' required />
    <input type='tel' id='cPhone' class='custInput' placeholder='WhatsApp / Phone Number (Required)' required />
    <input type='text' id='cAddr' class='custInput' placeholder='Ghar Ka Pura Pata & Shehar (Required)' required />

    <button id='codBtn' style='width:100%;background:#ea580c;margin-top:6px;font-size:15px'>💵 Confirm Cash on Delivery (COD)</button>
    <div style='font-size:11px;color:#64748b;margin-top:4px;text-align:center'>Order seedha Owner ki Google Sheet mein live save ho jayega.</div>
    <button id='cx' style='width:100%;margin-top:8px'>Cancel</button>
  `;

  document.getElementById('codBtn').onclick=()=>{
    const name = document.getElementById('cName').value.trim();
    const phone = document.getElementById('cPhone').value.trim();
    const addr = document.getElementById('cAddr').value.trim();

    if(!name || !phone || !addr){
      alert("Meharbani karke delivery ke liye Naam, Phone aur Address lazmi darj karein!");
      return;
    }

    ft.innerHTML='<div style="padding:14px 0;font-weight:700;color:#ea580c">⏳ Sending Order to Google Sheet & Generating Invoice…</div>';
    
    setTimeout(()=>{
      if(tok!==billTok)return;billNo++;
      const now = new Date();
      const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const itemsSummary = purchasedItems.map(i => `${i.n} (x${i.q})`).join(", ");

      sendOrderToGoogleSheet({
        timestamp: dateStr,
        invoiceNumber: "INV-" + billNo,
        customerName: name,
        customerPhone: phone,
        customerAddress: addr,
        itemsList: itemsSummary,
        totalAmount: tot,
        paymentMethod: "Cash on Delivery (COD)"
      });

      ft.innerHTML=`
        <div class='r' style='background:#fff7ed;padding:8px;border-radius:8px;color:#ea580c'><b>✅ ORDER RECORDED IN OWNER SHEET</b></div>
        <div class='r'><span>Invoice Number</span><b>INV-${billNo}</b></div>
        <div class='r'><span>Customer</span><b>${name}</b></div>
        <div class='r'><span>Amount Payable</span><b>PKR ${tot}</b></div>
        <div class='r'><span>Payment Type</span><b>Cash on Delivery (COD)</b></div>
        <button id='dlPdf' style='width:100%;background:#0284c7;margin-top:12px;font-size:14px'>📥 Download Invoice (PDF)</button>
        <button id='dn' style='width:100%;margin-top:8px'>Done / Close</button>
      `;

      document.getElementById('dlPdf').onclick=()=>{
        generatePdfInvoice(purchasedItems, sub, gst, tot, billNo, dateStr, name, phone, addr);
      };

      for(const k in cart)delete cart[k];render();trolleyClear();
      const r=CT[3];r.busy=0;r.reset=4;disp(r,'COD: PKR '+tot,'#16a34a');
      document.getElementById('dn').onclick=closeBill;
    },1000);
  };
  document.getElementById('cx').onclick=closeBill;
}

billBtn.onclick=()=>{
  const ids=Object.keys(cart);if(!ids.length)return;
  const tok=++billTok;bill.style.display='flex';CT[3].busy=1;disp(CT[3],'SCANNING ITEMS…','#f59f00');
  bc.innerHTML=`
    <div style='text-align:center;border-bottom:2px solid #ea580c;padding-bottom:6px;margin-bottom:8px'>
      <b style='font-size:16px;color:#ea580c'>ORANGE MART MEGA</b>
      <div style='font-size:11px;color:#64748b'>TAX INVOICE · CASH ON DELIVERY ONLY</div>
      <div style='font-size:12px;font-weight:600;margin-top:2px'>CHECKOUT LANE 04 (EXPRESS)</div>
    </div>
    <div id='rows'></div>
    <div id='ft' style='margin-top:10px'><button id='cx'>Cancel</button></div>
  `;
  const rows=document.getElementById('rows'),ft=document.getElementById('ft');
  document.getElementById('cx').onclick=closeBill;
  let sub=0;const gap=Math.min(350,2800/ids.length);
  const purchasedItems=[];

  ids.forEach((id,k)=>setTimeout(()=>{
    if(tok!==billTok)return;
    const q=cart[id],a=q*PR[id].p;sub+=a;
    purchasedItems.push({n:PR[id].n, q, p:PR[id].p});
    rows.insertAdjacentHTML('beforeend',`<div class='r'><span>${PR[id].e} ${PR[id].n} ×${q}</span><b>PKR ${a}</b></div>`);
    if(k===ids.length-1)setTimeout(()=>{if(tok===billTok)pay(sub,tok,ft,purchasedItems)},400);
  },k*gap+200));
};

// ==========================================
// 6. TICK & DISTANCE CHECK
// ==========================================
function tick(dt){
  const T=clock.elapsedTime;
  NP.forEach(n=>npcTick(n,dt,T));
  CT.forEach(c=>{
    c.ck.arms[1].rotation.x=c.busy?-0.9+Math.sin(T*10)*.35:Math.sin(T*2)*.05;
    if(c.reset>0){c.reset-=dt;if(c.reset<=0&&!c.busy)disp(c,c.real?'CHECKOUT 04 · OPEN':'LANE OPEN',c.real?'#16a34a':'#ea580c')}
  });

  const p=cam.position;

  // Sensor Auto Doors
  const distToEntrance = Math.hypot(p.x - 10, p.z - 18.35);
  updateAutoDoors(dt, distToEntrance);

  // Proximity to Checkout 04
  const nearCheckout=Math.hypot(p.x-5.5,p.z-10.2)<2.8&&bill.style.display!=='flex';
  billBtn.style.display=nearCheckout?'block':'none';
  if(nearCheckout){const w=Object.keys(cart).length?'💳 Proceed to Checkout':'💳 Cart is empty';if(billBtn.textContent!==w)billBtn.textContent=w}

  // Proximity to Manager
  const distToManager = Math.hypot(p.x - 14, p.z - (-16.5));
  let nearSalesman = null;
  SALESMEN.forEach(sm=>{
    const d = Math.hypot(p.x - sm.position.x, p.z - sm.position.z);
    if(d < 2.6) nearSalesman = sm;
  });

  if(dialogModal.style.display !== 'block'){
    if(distToManager < 3.2){
      talkPromptBtn.style.display = 'block';
      talkPromptBtn.textContent = '👔 Talk to Manager (Customer Care)';
      talkPromptBtn.onclick = openManagerDialog;
    } else if(nearSalesman){
      talkPromptBtn.style.display = 'block';
      talkPromptBtn.textContent = `💬 Ask ${nearSalesman.userData.name} (${nearSalesman.userData.section})`;
      talkPromptBtn.onclick = () => openSalesmanDialog(nearSalesman);
    } else {
      talkPromptBtn.style.display = 'none';
    }
  } else {
    talkPromptBtn.style.display = 'none';
  }
}

setTimeout(()=>document.getElementById('hint').style.opacity=0,8500);

// Collision & Movement Bounds
const blocked=(x,z)=>BL.some(g=>Math.abs(x-g.x)<g.hx&&Math.abs(z-g.z)<g.hz);
const clock=new THREE.Clock();

function loop(){
  const dt=Math.min(clock.getDelta(),.05),sp=3.4*dt;
  const f=keys.f-keys.b,r=keys.r-keys.l,p=cam.position;
  const nx=p.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*sp,nz=p.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*sp;
  if(!blocked(nx,p.z))p.x=nx;
  if(!blocked(p.x,nz))p.z=nz;
  p.x=Math.max(-17.2,Math.min(17.2,p.x));p.z=Math.max(-18.5,Math.min(18.2,p.z));
  cam.rotation.set(pitch,yaw,0);
  tick(dt);
  R.render(S,cam);
  requestAnimationFrame(loop);
}
loop();
