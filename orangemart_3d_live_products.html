<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>OrangeMart 3D — Cash on Delivery</title>
<style>
:root{--orange:#f97316;--dark:#101827;--panel:rgba(15,23,42,.96)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas#scene{display:block;width:100%;height:100%}button,input,select{font:inherit}button{cursor:pointer}#top{position:fixed;z-index:10;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}#brand{pointer-events:auto;background:linear-gradient(135deg,#111827,#273449);border:1px solid #ffffff30;padding:8px 12px;border-radius:14px;font-weight:900;box-shadow:0 8px 24px #0007;font-size:14px}#brand small{display:block;color:#fdba74;font-size:10px;letter-spacing:1px}#actions{display:flex;gap:6px;pointer-events:auto}.btn{border:1px solid #ffffff38;background:#111827e8;color:#fff;border-radius:11px;padding:9px 11px;font-weight:750;box-shadow:0 4px 16px #0004}.btn.orange{background:linear-gradient(135deg,#fb923c,#ea580c);border-color:#fdba74}.panel{position:fixed;z-index:20;right:10px;top:calc(env(safe-area-inset-top,0px) + 65px);width:min(390px,94vw);max-height:72vh;overflow:auto;background:var(--panel);border:1px solid #ffffff2b;border-radius:17px;padding:13px;box-shadow:0 18px 50px #0009;display:none;backdrop-filter:blur(12px)}.panel h3{margin:2px 0 10px;font-size:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff18}.muted{color:#cbd5e1;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product{min-width:0;background:#1e293b;border:1px solid #ffffff20;border-radius:12px;overflow:hidden}.product img{width:100%;height:112px;object-fit:contain;background:#fff;display:block}.pbody{padding:8px}.pname{font-size:12px;font-weight:800;min-height:32px}.price{color:#fdba74;font-weight:900;margin:5px 0}.smallbtn{width:100%;border:0;border-radius:8px;padding:8px;background:#f97316;color:white;font-weight:800}.field{display:block;width:100%;margin:6px 0;padding:10px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white}#pad{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:10;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px}#pad button{border:1px solid #ffffff40;border-radius:13px;background:#0f172ac9;color:#fff;font-size:20px;touch-action:none;backdrop-filter:blur(8px)}#hint{position:fixed;z-index:10;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);left:50%;transform:translateX(-50%);max-width:85vw;text-align:center;background:#0f172ad9;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;font-size:12px;pointer-events:none}#toast{position:fixed;z-index:40;top:42%;left:50%;transform:translateX(-50%);background:#16a34a;color:white;padding:10px 16px;border-radius:24px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s}#detail,#checkout{position:fixed;z-index:50;inset:0;background:#020617c9;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(6px)}.modal{width:min(420px,100%);max-height:88vh;overflow:auto;background:#fff;color:#0f172a;border-radius:18px;padding:16px}.modal img{width:100%;height:190px;object-fit:contain;background:#f8fafc;border-radius:12px}.modal h2{font-size:19px;margin:10px 0 4px}.modal .field{background:white;color:#111827;border-color:#cbd5e1}.modal button{margin-top:7px}.cats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cats button{background:#1e293b;color:#fff;border:1px solid #ffffff20;padding:10px;border-radius:10px;text-align:left}.pill{display:inline-block;background:#ffedd5;color:#9a3412;padding:3px 7px;border-radius:99px;font-size:11px;font-weight:800}@media(max-width:520px){#brand{font-size:12px;padding:7px 9px}#actions .btn{font-size:11px;padding:8px 9px}.panel{right:7px;top:calc(env(safe-area-inset-top,0px) + 60px);max-height:70vh}.product img{height:95px}#hint{font-size:11px}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body>
<canvas id="scene"></canvas><div id="top"><div id="brand">🟠 ORANGEMART <small>3D SMART STORE · CASH ON DELIVERY</small></div><div id="actions"><button class="btn" id="directoryBtn">☰ Categories</button><button class="btn orange" id="cartBtn">🛒 0 · PKR 0</button></div></div>
<div class="panel" id="directory"><h3>🧭 Store Directory</h3><div class="cats" id="catList"></div><p class="muted">Category select karein ya 3D store mein shelves par tap karein.</p></div>
<div class="panel" id="catalog"><div class="row"><h3 id="catalogTitle">OrangeMart Products</h3><button class="btn" id="closeCatalog">✕</button></div><input id="search" class="field" placeholder="Product search karein…"><div class="grid" id="productGrid"></div><button class="btn orange" id="loadMore" style="width:100%;margin-top:10px">Load More Products</button><p class="muted" id="loadStatus"></p></div>
<div class="panel" id="cartPanel"><div class="row"><h3>🛒 Your Cart</h3><button class="btn" id="closeCart">✕</button></div><div id="cartRows"></div><div class="row"><b>Total</b><b id="cartTotal">PKR 0</b></div><button class="btn orange" id="checkoutBtn" style="width:100%">Cash on Delivery Checkout</button><button class="btn" id="emptyCart" style="width:100%;margin-top:7px">Empty Cart</button></div>
<div id="detail"><div class="modal" id="detailContent"></div></div><div id="checkout"><div class="modal" id="checkoutContent"></div></div><div id="toast"></div><div id="hint">3D store mein move karein · shelves par tap karke products dekhein · COD order WhatsApp par bhejein</div>
<div id="pad"><button></button><button data-k="f">▲</button><button></button><button data-k="l">◀</button><button data-k="b">▼</button><button data-k="r">▶</button></div>
<script>
const WHATSAPP='923105784772';
const canvas=document.getElementById('scene');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);
const scene=new THREE.Scene();scene.background=new THREE.Color('#182131');scene.fog=new THREE.Fog('#182131',15,42);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,90);camera.rotation.order='YXZ';camera.position.set(0,1.6,9);
scene.add(new THREE.HemisphereLight('#ffffff','#334155',1.3));const sun=new THREE.DirectionalLight('#fff1d6',1.1);sun.position.set(4,10,5);scene.add(sun);
const mat=c=>new THREE.MeshLambertMaterial({color:c});const solid=(w,h,d,color,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);scene.add(m);return m};
solid(22,.12,28,'#dbe2ea',0,-.08,-1);solid(22,.12,28,'#151a24',0,4,-1);solid(.18,4,28,'#e2e8f0',-11,2,-1);solid(.18,4,28,'#e2e8f0',11,2,-1);solid(22,4,.18,'#cbd5e1',0,2,-15);
// OrangeMart sign
function signTexture(text){const c=document.createElement('canvas');c.width=1024;c.height=180;const x=c.getContext('2d');x.fillStyle='#111827';x.fillRect(0,0,1024,180);x.strokeStyle='#f97316';x.lineWidth=10;x.strokeRect(6,6,1012,168);x.fillStyle='white';x.font='900 64px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(text,512,90);return new THREE.CanvasTexture(c)}const sign=new THREE.Mesh(new THREE.PlaneGeometry(9,1.6),new THREE.MeshBasicMaterial({map:signTexture('ORANGEMART · CASH ON DELIVERY')}));sign.position.set(0,2.8,-14.85);scene.add(sign);
const loader=new THREE.TextureLoader();let products=[],categories=[],visibleCount=12,selectedCategory='All',cart={},productMeshes=[],shelfSpots=[];let loaded=false;
const fmt=n=>'PKR '+Number(n||0).toLocaleString('en-PK');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imagePath(p){return p.localImage||p.img||p.image||p.fallbackImg||''}function imgSrc(p){return imagePath(p)}
function labelTexture(p){const c=document.createElement('canvas');c.width=256;c.height=310;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,256,310);x.fillStyle='#f97316';x.fillRect(0,0,256,14);x.fillStyle='#fff7ed';x.fillRect(8,22,240,178);x.fillStyle='#9a3412';x.font='bold 17px system-ui';x.textAlign='center';const name=p.name||'Product';let words=name.split(' '),lines=[''];for(const word of words){let last=lines.length-1;if((lines[last]+' '+word).trim().length>20)lines.push(word);else lines[last]=(lines[last]+' '+word).trim()}lines.slice(0,3).forEach((l,i)=>x.fillText(l,128,218+i*22));x.fillStyle='#ea580c';x.font='900 27px system-ui';x.fillText(fmt(p.price),128,286);return new THREE.CanvasTexture(c)}
function clearShelf(){for(const m of productMeshes){scene.remove(m);if(m.geometry)m.geometry.dispose()}productMeshes=[];shelfSpots=[]}
function buildShelves(){clearShelf();const cols=4,rows=Math.ceil(products.length/cols);const xPositions=[-7.4,-2.5,2.5,7.4];for(let col=0;col<cols;col++){let x=xPositions[col];for(let level=0;level<3;level++){solid(1.6,.08,Math.min(20,Math.max(5,rows*.55)), '#9a6b43',x,.55+level*.92,-2.5);solid(1.65,.07,Math.min(20,Math.max(5,rows*.55)),'#263244',x,.62+level*.92,-2.5)}}
 products.forEach((p,i)=>{const col=i%cols,row=Math.floor(i/cols),x=xPositions[col],z=-10.5+row*.65,level=(row%3),y=.86+level*.92;const geometry=new THREE.BoxGeometry(.48,.52,.4);const tex=labelTexture(p);const m=new THREE.Mesh(geometry,[mat('#d1d5db'),mat('#d1d5db'),mat('#d1d5db'),mat('#d1d5db'),new THREE.MeshLambertMaterial({map:tex}),mat('#d1d5db')]);m.position.set(x+(i%2)*.55-.25,y,z);m.userData.productId=p.id;m.userData.p=p;scene.add(m);productMeshes.push(m);shelfSpots.push({x:m.position.x,y,z,cat:p.category});});
 // end-cap category panels
 categories.forEach((c,i)=>{const x=-8.3+(i%4)*5.5,z=-12.7-Math.floor(i/4)*.15;const cv=document.createElement('canvas');cv.width=512;cv.height=100;const cx=cv.getContext('2d');cx.fillStyle='#111827';cx.fillRect(0,0,512,100);cx.fillStyle='#fb923c';cx.fillRect(0,0,10,100);cx.fillStyle='white';cx.font='bold 30px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(c.name,260,50,470);const panel=new THREE.Mesh(new THREE.PlaneGeometry(3.2,.62),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));panel.position.set(x,3.25,z);scene.add(panel)});
}
function productCard(p){return `<article class="product"><img src="${safe(imgSrc(p))}" alt="${safe(p.name)}" loading="lazy" onerror="if(this.dataset.fallback!=='1'&&'${safe(p.fallbackImg||'')}'){this.dataset.fallback='1';this.src='${safe(p.fallbackImg||'')}'}else{this.style.visibility='hidden'}"><div class="pbody"><div class="pname">${safe(p.name)}</div><div class="muted">${safe(p.category||'Products')}</div><div class="price">${fmt(p.price)}</div><button class="smallbtn" data-detail="${safe(p.id)}">View / Add</button></div></article>`}
function getFiltered(){const q=(document.getElementById('search')?.value||'').toLowerCase();return products.filter(p=>(selectedCategory==='All'||p.category===selectedCategory)&&(`${p.name} ${p.category} ${p.desc||''}`).toLowerCase().includes(q))}
function renderCatalog(reset=false){const all=getFiltered();if(reset)visibleCount=12;const shown=all.slice(0,visibleCount);document.getElementById('productGrid').innerHTML=shown.map(productCard).join('')||'<p class="muted">Is category mein koi product nahi mila.</p>';document.getElementById('catalogTitle').textContent=selectedCategory==='All'?'OrangeMart Products':selectedCategory;document.getElementById('loadMore').style.display=visibleCount<all.length?'block':'none';document.getElementById('loadStatus').textContent=`${shown.length} / ${all.length} products shown · products.json`;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));}
function showPanel(id){['directory','catalog','cartPanel'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none')};function hidePanels(){['directory','catalog','cartPanel'].forEach(x=>document.getElementById(x).style.display='none')}
function openDetail(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;let colors=Array.isArray(p.colors)?p.colors:[],sizes=Array.isArray(p.sizes)?p.sizes:[];document.getElementById('detailContent').innerHTML=`<button class="btn" id="detailClose" style="float:right;color:white">✕</button><img src="${safe(imgSrc(p))}" alt="${safe(p.name)}" onerror="this.src='${safe(p.fallbackImg||'')}';this.onerror=null"><h2>${safe(p.name)}</h2><div class="pill">${safe(p.category||'Product')}</div><p style="font-size:22px;font-weight:900;color:#ea580c">${fmt(p.price)}</p><p>${safe(p.desc||'')}</p>${colors.length?`<label>Color<select class="field" id="optColor"><option value="">Choose color</option>${colors.map(c=>`<option>${safe(c)}</option>`).join('')}</select></label>`:''}${sizes.length?`<label>Size / Model<select class="field" id="optSize"><option value="">Choose size</option>${sizes.map(s=>`<option>${safe(s)}</option>`).join('')}</select></label>`:''}<label>Quantity<input class="field" id="optQty" type="number" min="1" max="99" value="1"></label><button class="btn orange" id="addDetail" style="width:100%">Add to Cart</button>`;document.getElementById('detail').style.display='flex';document.getElementById('detailClose').onclick=()=>document.getElementById('detail').style.display='none';document.getElementById('addDetail').onclick=()=>{const color=document.getElementById('optColor')?.value||'',size=document.getElementById('optSize')?.value||'';if(colors.length&&!color){alert('Color select karein.');return}if(sizes.length&&!size){alert('Size / Model select karein.');return}const qty=Math.max(1,Math.min(99,parseInt(document.getElementById('optQty').value)||1));addCart(p,color,size,qty);document.getElementById('detail').style.display='none';toast(`${p.name} cart mein add ho gaya`)};}
function addCart(p,color='',size='',qty=1){const key=[p.id,color,size].join('|');if(!cart[key])cart[key]={p,color,size,qty:0};cart[key].qty+=qty;renderCart()}
function renderCart(){let count=0,total=0;const rows=Object.entries(cart);rows.forEach(([k,v])=>{count+=v.qty;total+=v.qty*Number(v.p.price||0)});document.getElementById('cartBtn').textContent=`🛒 ${count} · ${fmt(total)}`;document.getElementById('cartRows').innerHTML=rows.map(([k,v])=>`<div class="row"><div style="min-width:0"><b>${safe(v.p.name)}</b><div class="muted">${safe([v.color,v.size].filter(Boolean).join(' · '))} · ${v.qty} × ${fmt(v.p.price)}</div><button class="btn" data-remove="${safe(k)}" style="padding:4px 8px;margin-top:5px">− Remove</button></div><b>${fmt(v.qty*v.p.price)}</b></div>`).join('')||'<p class="muted">Cart khaali hai.</p>';document.getElementById('cartTotal').textContent=fmt(total);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];renderCart()});document.getElementById('checkoutBtn').disabled=!count;document.getElementById('checkoutBtn').style.opacity=count?1:.5}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.opacity=0,1800)}
function checkout(){const entries=Object.values(cart);if(!entries.length){toast('Pehle cart mein product add karein');return}const total=entries.reduce((s,v)=>s+v.qty*Number(v.p.price||0),0);document.getElementById('checkoutContent').innerHTML=`<button class="btn" id="checkoutClose" style="float:right;color:white">✕</button><h2>Cash on Delivery</h2><p>Order total: <b style="color:#ea580c">${fmt(total)}</b></p><p class="muted">Apna delivery address aur contact number dein. Confirm karne par WhatsApp message khulega.</p><form id="orderForm"><input class="field" name="name" placeholder="Full name" required maxlength="100"><input class="field" name="phone" placeholder="Mobile number" required maxlength="30"><textarea class="field" name="address" placeholder="Complete delivery address" required rows="3" maxlength="500"></textarea><textarea class="field" name="notes" placeholder="Extra instructions (optional)" rows="2" maxlength="300"></textarea><button class="btn orange" type="submit" style="width:100%">Send COD Order on WhatsApp</button></form><p class="muted">WhatsApp par message khulne ke baad Send dabana zaroori hai.</p>`;document.getElementById('checkout').style.display='flex';document.getElementById('checkoutClose').onclick=()=>document.getElementById('checkout').style.display='none';document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name'),phone=f.get('phone'),address=f.get('address'),notes=f.get('notes');let msg=`ORANGEMART — CASH ON DELIVERY ORDER%0A%0ACustomer: ${name}%0APhone: ${phone}%0AAddress: ${address}%0A%0AItems:%0A`;entries.forEach(v=>{msg+=`- ${v.p.name}${v.color?' | Color: '+v.color:''}${v.size?' | Size: '+v.size:''} × ${v.qty} = PKR ${v.qty*v.p.price}%0A`});msg+=`%0ATotal: PKR ${total}%0APayment: Cash on Delivery${notes?'%0ANotes: '+notes:''}`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(decodeURIComponent(msg))}`,'_blank');document.getElementById('checkout').style.display='none';toast('WhatsApp order message tayyar hai; Send dabayein.');}}
async function loadData(){try{const res=await fetch('./products.json',{cache:'no-store'});if(!res.ok)throw Error('products.json load nahi hui');const data=await res.json();products=Array.isArray(data)?data:(data.products||[]);categories=(data.categories||[]);if(!products.length)throw Error('JSON mein products nahi hain');loaded=true;buildShelves();renderCatalog(true);renderCart();renderCategories();}catch(e){document.getElementById('loadStatus').textContent='products.json load nahi hui. index.html aur products.json same folder mein rakhein, aur GitHub Pages se website kholein.';console.error(e)}}
function renderCategories(){const names=['All',...new Set([...categories.map(c=>c.name),...products.map(p=>p.category).filter(Boolean)])];document.getElementById('catList').innerHTML=names.map(n=>`<button data-cat="${safe(n)}">${n==='All'?'🛍️': '📦'} ${safe(n)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;visibleCount=12;renderCatalog(true);showPanel('catalog')})}
// 3D controls and shelf selection
const keys={f:0,b:0,l:0,r:0};document.querySelectorAll('#pad [data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{keys[k]=1;e.preventDefault()};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});const keyMap={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};addEventListener('keydown',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=1});addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=0});let yaw=0,pitch=-.04,drag=null;canvas.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.005;pitch=Math.max(-.8,Math.min(.8,pitch-(e.clientY-drag.y)*.004));drag.x=e.clientX;drag.y=e.clientY});const ray=new THREE.Raycaster();function tap(x,y){ray.setFromCamera({x:x/innerWidth*2-1,y:-(y/innerHeight)*2+1},camera);const h=ray.intersectObjects(productMeshes)[0];if(h&&h.distance<12){openDetail(h.object.userData.productId);return}showPanel('catalog');renderCatalog(true)}canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8&&performance.now()-drag.t<350)tap(e.clientX,e.clientY);drag=null});
document.getElementById('directoryBtn').onclick=()=>{const v=document.getElementById('directory').style.display==='block';hidePanels();if(!v)showPanel('directory')};document.getElementById('cartBtn').onclick=()=>{const v=document.getElementById('cartPanel').style.display==='block';hidePanels();if(!v)showPanel('cartPanel')};document.getElementById('closeCatalog').onclick=hidePanels;document.getElementById('closeCart').onclick=hidePanels;document.getElementById('loadMore').onclick=()=>{visibleCount+=12;renderCatalog()};document.getElementById('search').addEventListener('input',()=>renderCatalog(true));document.getElementById('checkoutBtn').onclick=checkout;document.getElementById('emptyCart').onclick=()=>{cart={};renderCart()};
const clock=new THREE.Clock();function loop(){const dt=Math.min(clock.getDelta(),.05),speed=3*dt,p=camera.position;const f=keys.f-keys.b,r=keys.r-keys.l;const nx=p.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*speed,nz=p.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*speed;p.x=Math.max(-9.7,Math.min(9.7,nx));p.z=Math.max(-13.5,Math.min(10.5,nz));camera.rotation.set(pitch,yaw,0);renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});loadData();loop();setTimeout(()=>document.getElementById('hint').style.opacity=0,10000);
</script></body></html>
